<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reserva confirmada | Desire Airways</title><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container header-inner"><a href="index.html" class="brand"><span class="brand-mark"><img src="assets/logo.jpg" alt="Desire Airways"></span><span class="brand-text"><span class="brand-name">Desire<em>Airways</em></span><span class="brand-tagline">Donde tus historias despegan</span></span></a><div class="header-actions"><a href="perfil.html" class="btn btn-primary">Mi perfil</a></div></div></header><main><section class="section"><div class="container"><div class="card-panel" style="max-width:760px;margin:auto;text-align:center"><div style="font-size:3rem">✓</div><p class="eyebrow">Reserva confirmada</p><h1 class="section-title">¡Tu historia está lista para despegar!</h1><p class="section-lead">Hemos guardado tu reserva en este dispositivo.</p><div id="confirmation-image" style="margin:24px auto;border-radius:18px;overflow:hidden;max-width:760px"></div><div class="summary-card" style="margin:28px auto;text-align:left"><div class="summary-row"><span>Código de reserva</span><strong id="code">—</strong></div><div class="summary-row"><span>Total pagado</span><strong id="total">—</strong></div></div><p class="summary-note" id="level-progress"></p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn btn-primary" href="index.html">Volver al inicio</a><a class="btn btn-ghost" href="mis-reservas.html">Ver mis reservas</a></div></div></div></section></main><script src="vuelos.js"></script><script src="reservas.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const r=leerEstado(RESERVAS_KEYS.reserva);if(!r){location.href='index.html';return}code.textContent=r.codigo;total.textContent=formatearMoneda(r.total);const perfil=leerEstado('da_perfil')||{};const vuelosCompletados=Number(perfil.vuelos||perfil.reservas)||0;document.getElementById('level-progress').textContent=vuelosCompletados>=10?'¡Ya alcanzaste el primer nivel!':'Te faltan '+(10-vuelosCompletados)+' vuelos para el primer nivel';// FOTO POR DESTINO: los archivos dest-*.jpg se pueden reemplazar por tus propias imágenes.
