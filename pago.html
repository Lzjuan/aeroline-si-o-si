<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pago | Desire Airways</title><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container header-inner"><a href="index.html" class="brand"><span class="brand-mark"><img src="assets/logo.jpg" alt="Desire Airways"></span><span class="brand-text"><span class="brand-name">Desire<em>Airways</em></span><span class="brand-tagline">Donde tus historias despegan</span></span></a><div class="header-actions"><a href="perfil.html" class="link-quiet">Mi perfil</a><a href="tel:+573127256102" class="btn btn-ghost">☎ Soporte</a></div></div></header><main><section class="section booking-flow-section"><div class="container"><ol class="stepper-progress"><li class="is-done">Vuelo</li><li class="is-done">Detalle</li><li class="is-done">Asiento</li><li class="is-done">Pasajeros</li><li class="is-done">Extras</li><li class="is-active">Pago</li></ol><div class="flow-layout"><div class="card-panel"><p class="eyebrow">Último paso</p><h1 class="section-title">Completa tu pago</h1><form id="payment-form"><div class="field"><label for="method">Método de pago</label><select id="method"><option>Tarjeta débito/crédito</option><option>PSE</option><option>Transferencia bancaria</option></select></div><div class="search-grid" style="margin-top:16px"><div class="field"><label for="card">Número de tarjeta</label><input id="card" inputmode="numeric" placeholder="0000 0000 0000 0000" required></div><div class="field"><label for="name">Titular</label><input id="name" placeholder="Nombre completo" required></div><div class="field"><label for="expiry">Vencimiento</label><input id="expiry" placeholder="MM/AA" required></div><div class="field"><label for="cvv">CVV</label><input id="cvv" inputmode="numeric" maxlength="4" placeholder="123" required></div></div><label style="display:flex;gap:8px;margin:18px 0;font-size:.9rem"><input type="checkbox" required> Acepto los términos de la reserva y confirmo que los datos son correctos.</label><button class="btn btn-primary btn-large" type="submit">Pagar y confirmar reserva</button></form></div><aside class="flow-sidebar"><div class="summary-card"><h3>Resumen de pago</h3><div id="pay-summary"></div><div class="summary-divider"></div><div class="summary-row"><span>Descuento</span><span id="pay-discount">—</span></div><div class="summary-row"><span>Total</span><strong id="pay-total">—</strong></div><p class="summary-note">Pago simulado para fines demostrativos.</p></div></aside></div></div></section></main><footer class="site-footer"><div class="container footer-bottom"><p>© 2026 Desire Airways. Todos los datos son simulados.</p></div></footer><script src="vuelos.js"></script><script src="reservas.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const v=leerEstado(RESERVAS_KEYS.vuelo),s=leerEstado(RESERVAS_KEYS.asiento),p=leerEstado(RESERVAS_KEYS.pasajeros),e=leerEstado(RESERVAS_KEYS.extras);if(!v||!p){location.href='pasajeros.html';return}const asientos=normalizarAsientosSeleccionados(s);const busqueda=leerEstado(RESERVAS_KEYS.busqueda)||{};const totalPagando=Math.max(1,Number(busqueda.adultos ?? busqueda.adults ?? 1)+Number(busqueda.ninos ?? busqueda.children ?? 0));const subtotal=(v.precio*totalPagando) + calcularPrecioExtraAsientos(asientos) + (e?.items||[]).reduce((a,x)=>a+x.precio,0);const profileActual=leerEstado('da_perfil')||{nombre:p[0]?.nombre||'Viajero Desire',correo:p[0]?.correo||'',millas:0,reservas:0,vuelos:0};const vuelosCompletados=Number(profileActual.vuelos||profileActual.reservas)||0;const descuento=vuelosCompletados>=40?.30:vuelosCompletados>=20?.15:vuelosCompletados>=10?.05:0;const total=Math.round(subtotal*(1-descuento));document.getElementById('pay-summary').innerHTML='<div class="summary-row"><span>'+buscarAeropuerto(v.origen).ciudad+' → '+buscarAeropuerto(v.destino).ciudad+'</span><span>'+v.id+'</span></div><div class="summary-row"><span>Pasajeros</span><span>'+p.length+'</span></div>';document.getElementById('pay-total').textContent=formatearMoneda(total);document.getElementById('pay-discount').textContent=descuento?Math.round(descuento*100)+'%':'0%';document.getElementById('payment-form').addEventListener('submit',ev=>{ev.preventDefault();const reserva={codigo:generarCodigoReserva(),fechaCreacion:new Date().toISOString(),vuelo:v,asiento:asientos,pasajeros:p,extras:e?.items||[],total,millas:Math.max(100,Math.floor(total/10000)),descuento:Math.round(descuento*100)};guardarReservaCompletada(reserva);const profile=profileActual;profile.millas=(profile.millas||0)+reserva.millas;profile.reservas=(profile.reservas||0)+1;profile.vuelos=(profile.vuelos||0)+1;guardarEstado('da_perfil',profile);location.href='confirmacion.html'})});</script></body></html>
