<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mis reservas | Desire Airways</title><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container header-inner"><a href="index.html" class="brand"><span class="brand-mark"><img src="assets/logo.jpg" alt="Desire Airways"></span><span class="brand-text"><span class="brand-name">Desire<em>Airways</em></span><span class="brand-tagline">Donde tus historias despegan</span></span></a><div class="header-actions"><a href="perfil.html" class="link-quiet">Mi perfil</a></div></div></header><main><section class="section"><div class="container"><p class="eyebrow">Tu historial</p><h1 class="section-title">Mis reservas</h1><div id="reservas-list" style="display:grid;gap:16px;margin-top:22px"></div></div></section></main><script src="vuelos.js"></script><script src="reservas.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const list=document.getElementById('reservas-list'),rs=leerEstado(RESERVAS_KEYS.reservasGuardadas)||[];// FOTO POR DESTINO: los archivos dest-*.jpg se pueden reemplazar por tus propias imágenes.
const map={BOG:'dest-bogota.png',CTG:'dest-cartagena.webp',MDE:'dest-mde.jpg',CLO:'dest-clo.jpg',SMR:'dest-smr.jpg',IBE:'dest-armenia.webp',ADZ:'dest-san-andres.jpg',MIA:'dest-miami.jpg',JFK:'dest-new-york.webp',MEX:'dest-mexico-city.jpg',LIM:'dest-lima.jpg',EZE:'dest-buenos-aires.jpg',SCL:'dest-santiago.jpg',YYZ:'dest-toronto.jpg',GRU:'dest-buenos-aires.jpg',MAD:'dest-mad.jpg',CDG:'dest-paris.jpg',LHR:'dest-lhr.jpg',BCN:'dest-bcn.jpg',LIS:'dest-lis.jpg'};if(!rs.length){list.innerHTML='<div class="empty-state"><h3>Aún no tienes reservas</h3><p>Cuando completes un viaje aparecerá aquí.</p><a class="btn btn-primary" href="index.html#buscador">Reservar vuelo</a></div>';return}list.innerHTML=rs.slice().reverse().map(r=>{const city=buscarAeropuerto(r.vuelo.destino).ciudad;return '<article class="card-panel" style="overflow:hidden"><img src="assets/'+(map[r.vuelo.destino]||'aircraft-flight.svg')+'" alt="'+city+'" style="width:100%;height:170px;object-fit:cover;border-radius:14px;margin-bottom:14px"><div><div class="summary-row"><strong>'+r.codigo+'</strong><span>'+formatearMoneda(r.total)+'</span></div><p>'+buscarAeropuerto(r.vuelo.origen).ciudad+' → '+city+' · '+r.vuelo.id+'</p><p style="color:var(--gray-500)">'+r.millas+' millas ganadas</p></div></article>'}).join('')})</script></body></html>
